<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Form & Fade Image</title>
    <style>
        /* Elemen Universal */
        * {
            box-sizing: border-box;
        }

        /* Gaya Paragraf */
        p {
            color: yellow;
            font-size: 25px;
            background-color: purple;
            font-family: Arial, Helvetica, sans-serif;
            height: auto;
            width: 400px;
            border-radius: 10px;
            margin: 5px;
            padding: 13px;
        }

        /* Gaya Efek Hover Gambar (Fade In) */
        .container {
            position: relative;
            width: 50%;
        }

        .image {
            opacity: 1;
            display: block;
            width: 100%;
            height: auto;
            transition: .5s ease;
            backface-visibility: hidden;
        }

        .middle {
            transition: .5s ease;
            opacity: 0;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            -ms-transform: translate(-50%, -50%);
        }

        .container:hover .image {
            opacity: 0.3;
        }

        .container:hover .middle {
            opacity: 1;
        }

        .text {
            background-color: #4CAF50;
            color: white;
            font-size: 16px;
            padding: 16px 32px;
        }

        /* Gaya Form Responsif */
        .responsive-form {
            max-width: 600px;
            width: 100%;
            border-radius: 4px;
            border: 2px solid #04AA6D;
            background-color: #f2f2f2;
            padding: 20px;
            margin-top: 20px;
        }

        form {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
        }

        label {
            display: block;
            min-width: 48%;
            margin-bottom: 10px;
        }

        input[type=text], select {
            min-width: 45%;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 10px;
        }

        /* Jika Anda ingin input teks berwarna hitam seperti di kode bocor Anda, 
           aktifkan baris di bawah ini: */
        /* 
        input[type=text] {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            background-color: black;
            color: white;
        } 
        */

        textarea {
            min-width: 45%;
            height: 150px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 10px;
        }

        input[type=submit] {
            width: 100%;
            background-color: #04AA6D;
            color: white;
            padding: 14px;
            margin: 8px 0;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        /* Media Query untuk Tampilan Layar Kecil (Mobile) */
        @media screen and (max-width: 600px) {
            label,
            input[type=text],
            input[type=submit],
            select, 
            textarea {
                flex: 100%;
                min-width: 100%;
            }
        }
    </style>
</head>
<body>

    <!-- Komponen Paragraf -->
    <p>Lorem ipsum dolor sit amet consectetur, adipisicing elit. Consequuntur corporis quaerat inventore cum. Cupiditate atque adipisci ut a fugiat veritatis itaque, eum molestiae deleniti architecto odit recusandae magnam sint consectetur!</p>
<p> hallo</p>
    <!-- Komponen Form Responsif -->
    <div class="responsive-form">
        <form action="/action_page.php">
            <label for="fname">First Name:</label>
            <input type="text" id="fname" name="fname" placeholder="Your first name">

            <label for="lname">Last Name:</label>
            <input type="text" id="lname" name="lname" placeholder="Your last name">

            <label for="country">Country:</label>
            <select id="country" name="country">
                <option value="australia">Australia</option>
                <option value="canada">Canada</option>
                <option value="usa">USA</option>
            </select>
            
            <label for="message">Message:</label>
            <textarea id="message" name="message" placeholder="Write something.."></textarea>

            <input type="submit" value="Submit">
        </form>
    </div>

    <!-- Komponen Efek Hover Gambar -->
    <h2>Fade in a Box</h2>
    <div class="container">
        <!-- Pastikan file LOGO.jpg berada di folder yang sama dengan file HTML ini -->
        <img src="pic_trulli.jpg" alt="464-Untitled.jpg" class="image" style="width:100%">
        <div class="middle">
            <div class="text">John Doe</div>
        </div>
    </div>
  
</body>
</html>
